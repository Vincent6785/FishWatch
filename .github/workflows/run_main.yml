name: Run main - analyse videos

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics opencv-python pandas matplotlib tqdm pynvml numpy

      - name: Run main script (skip detection)
        run: |
          python main.py

      - name: Check generated reports
        run: |
          ls -lh reports/
          test -f reports/merged_detections.csv
          test -f reports/activity_periods.csv
          test -f reports/gantt_total.png
          test -f reports/gantt_half_1.png
          test -f reports/gantt_half_2.png
          test -f reports/gantt_quarter_1.png
